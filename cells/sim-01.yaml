# Simulated cell used for M0 development and tests.
# All values here are placeholders for the sim; real cells get their own file
# with poses taught on the robot and timeouts measured on the machine.
cell_id: sim-01
machine:
  kind: vmc
  controller: sim
  clamp_released_sensor: true

# Hardware safety fitted to this cell (VERIFY ON HARDWARE).
safety:
  door_zone_interlock: true  # safety-rated door switch -> safety relay blocks zone entry

robot:
  kind: cobot6

# Named robot poses. cobot6: [x_mm, y_mm, z_mm, rx_deg, ry_deg, rz_deg].
# The required role poses must exist; extra names (e.g. tray_slot_3) are allowed.
poses:
  home:             [0, 0, 400, 180, 0, 0]
  above_raw_tray:   [300, -200, 250, 180, 0, 0]
  pick_raw:         [300, -200, 120, 180, 0, 0]
  above_fixture:    [650, 0, 300, 180, 0, 0]
  load:             [650, 0, 180, 180, 0, 0]
  tug_in_fixture:   [650, 0, 184, 180, 0, 0]  # 4 mm up from load: single-sensor clamp tug
  clear_of_machine: [350, 0, 350, 180, 0, 0]
  above_done_tray:  [300, 200, 250, 180, 0, 0]
  place_done:       [300, 200, 120, 180, 0, 0]

# Poses where the arm is inside the machine envelope. The door must be confirmed
# fully open and the spindle stopped before the arm may be at or moving to these.
machine_zone_poses: [above_fixture, load, tug_in_fixture]

# CNC programs this cell runs. expected_cycle_s: measured per program (VERIFY ON HARDWARE).
programs:
  P100:
    expected_cycle_s: 60
    tool: T12

# Max seconds allowed in each state before the controller goes to SAFE.
timeouts_s:
  pick_raw: 20
  load: 20
  clamp: 5
  retreat: 15
  machining_factor: 1.5  # MACHINING timeout = program expected_cycle_s x this
  watchman_wait_s: 120  # arm waits outside with the raw part for the watchman, then SAFE
  unclamp: 5
  unload: 20
  place_done: 20
  door: 8

# Sensor-pair plausibility. ASSUMPTION / VERIFY ON HARDWARE: travel times must be
# measured on the real machine; windows = measured travel + margin, and must exceed it.
io_plausibility:
  door_travel_s: 2.0
  door_plausibility_window_s: 3.0
  clamp_travel_s: 0.5
  clamp_plausibility_window_s: 1.0
  min_travel_fraction: 0.5  # faster than half the measured stroke = stuck-on sensor
  max_travel_fraction: 1.15  # arm waits for the worst-case stroke time before acting
  part_present_max_ignore_s: 0.5  # seat-sensor debounce (hard cap 1.0 s)

# Logical signal -> physical pin/address on the CNC I/O or safety relay.
pins:
  door_open_out: "Y0.0"
  door_close_out: "Y0.1"
  door_open_in: "X0.4"
  door_closed_in: "X0.0"
  clamp_out: "Y0.2"
  clamped_in: "X0.1"
  unclamped_in: "X0.5"
  part_present_in: "X0.6"  # fixture seat sensor. ASSUMPTION / VERIFY ON HARDWARE
  cycle_start_out: "Y0.3"
  cycle_done_in: "X0.2"
  feed_hold_out: "Y0.4"
  alarm_in: "X0.3"
  estop_ok_in: "X1.0"
  guard_closed_in: "X1.1"
  zone_interlock_ok_in: "X1.2"  # safety relay monitoring contact

# Watchman thresholds. ASSUMPTION / VERIFY ON HARDWARE: tune from M1 data.
watchman:
  sample_hz: 100
  stale_after_s: 0.5
  cut_settle_s: 1.0
  # STOP: cutting current below this fraction of this cycle's settled mean, for confirm_s.
  tool_break_current_ratio: 0.5
  tool_break_confirm_s: 0.3
  # STOP: current or vibration above these, for confirm_s.
  overload_current_a: 25.0
  vibration_rms_max_g: 3.0
  overload_confirm_s: 0.3
  # Chip buildup (within a cycle): recent chip_window_s mean / this cycle's early mean.
  chip_window_s: 2.0
  chip_alert_ratio: 1.2
  chip_stop_ratio: 1.5
  # Tool wear (across cycles): a cycle's early load / the reference's mean. The alert
  # ratios below are outer bounds; per-program limits derive from the reference spread.
  wear_alert_ratio: 1.25
  wear_stop_ratio: 1.5
  # References: recorded per program + tool under supervision (fresh tool confirmed,
  # reference_cycles cycles confirmed clean). Alert limits derive from their spread.
  reference_cycles: 5
  derived_limit_sigmas: 4.0
  # Must cover cycle-to-cycle load variation relative to a mean of only
  # reference_cycles cycles. The sim varies load up to +/-8%, so a clean cycle can reach
  # ~x1.13 of a low-side reference; 0.12 produced a false wear alert. SET FROM M1 DATA.
  derived_min_margin: 0.15
  reference_store: data/references/sim-01.json
